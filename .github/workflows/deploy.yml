name: Deploy Attendance App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attendance-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate Worker configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const expected = {
            'data-wrangler.jsonc': 'attendance-pedro-data',
            'wrangler.jsonc': 'attendance-pedro-media-public',
            'static-wrangler.jsonc': 'attendance-pedro'
          };
          for (const [file, name] of Object.entries(expected)) {
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (config.name !== name) throw new Error(`${file}: expected ${name}, got ${config.name}`);
          }
          NODE

      - name: Check JavaScript
        run: |
          node --check attendance-data-worker.js
          node --check photo-worker.js
          node --check static-worker.js

      - name: Run tests
        run: node --test tests/attendance.test.js

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4.136.1

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply attendance-pedro-data --remote --config data-wrangler.jsonc

      - name: Deploy D1 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config data-wrangler.jsonc

      - name: Deploy photo Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Prepare static assets
        run: |
          mkdir -p public/assets/avatars
          cp index.html Logo1.png LogoAppSCP.png manifest.webmanifest public/
          cp assets/avatars/*.png public/assets/avatars/

      - name: Deploy static app last
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config static-wrangler.jsonc

      - name: Verify production endpoints
        shell: bash
        run: |
          for attempt in {1..12}; do
            app_status=$(curl -sS -o /tmp/attendance-index.html -w '%{http_code}' https://attendance-pedro.pedrosill1944.workers.dev/ || true)
            cors_status=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS \
              -H 'Origin: https://attendance-pedro.pedrosill1944.workers.dev' \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization' \
              'https://attendance-pedro-data.pedrosill1944.workers.dev/?action=bootstrap' || true)
            if [ "$app_status" = '200' ] && grep -q 'Presenças de Ginástica' /tmp/attendance-index.html && [ "$cors_status" = '204' ]; then
              echo 'App pública e preflight CORS confirmados.'
              exit 0
            fi
            echo "A aguardar propagação (tentativa $attempt/12): app=$app_status cors=$cors_status"
            sleep 5
          done
          echo 'A app pública ou o preflight CORS não ficaram disponíveis.' >&2
          exit 1
